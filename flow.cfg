#==============================================================================
# flow.cfg : 全流程唯一需要修改的配置文件 (bash 语法, 等号两边不能有空格)
#==============================================================================

# 用哪套工艺库. 目前只有 tsmc180 这一套配置 (0.18um 1.8V 7 轨标准单元库, 6 层金属);
# 库文件的具体路径和单元名在 common/env.sh 里, 换库时在那里照样再写一段.
LIB=tsmc180

# 顶层模块名
TOP=function_gen

# 时钟周期 (ns). 题目要求 5.0 (200 MHz).
CLOCK_PERIOD=5.0

# 核心区利用率 (0~1) 和核心区到边界的距离 (um)
CORE_UTIL=0.40
CORE_MARGIN=20

# 工艺库根目录 (自备, 不随仓库提供). 目录结构见 common/env.sh 的 tsmc180 一段
TSMC_ROOT=/home/EDA/PDK/TSMC180
# 用几层金属的工艺文件 (4 / 5 / 6). LEF, 工艺文件, TLU+ 会一起切换
TSMC_METALS=6

# StarRC 的工艺文件. 没有就保持为空, 寄生参数改用 ICC2 提取并导出的 SPEF
STARRC_NXTGRD_WST=
STARRC_NXTGRD_TYP=
STARRC_NXTGRD_BST=
STARRC_MAPFILE=
# Calibre 规则文件由 common/env.sh 指向 PDK 目录, 这里不用填
CALIBRE_DRC_RULE=
CALIBRE_LVS_RULE=
